{% extends 'base.html' %}{% block title %}登录 · 东软健康{% endblock %}{% block content %}
<section class="auth-layout"><div class="auth-intro"><div class="eyebrow">WELCOME BACK / 欢迎回来</div><h1>照顾自己，<br><em>从这里开始。</em></h1><p>登录后继续记录，回顾属于你的健康数据。</p><div class="auth-decoration">✳</div></div><div class="panel auth-panel"><div class="eyebrow">YOUR HEALTH SPACE</div><h2>登录账户</h2><p class="muted">输入用户名和密码，进入健康空间。</p>{% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}<form method="post" class="form-stack"><label>用户名<input name="username" value="{{ username }}" autocomplete="username" required placeholder="请输入用户名"></label><label>密码<input type="password" name="password" autocomplete="current-password" required placeholder="请输入密码"></label><button class="button full">登录 <span>↗</span></button></form><p class="auth-tip">还没有账户？ <a href="{{ url_for('register') }}">立即注册 →</a></p><div class="demo-note">课堂演示账户：student1 / Student123</div></div></section>
{% endblock %}
