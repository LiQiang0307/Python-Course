{% extends 'base.html' %}{% block title %}注册 · 东软健康{% endblock %}{% block content %}
<section class="auth-layout"><div class="auth-intro"><div class="eyebrow">A FRESH START / 创建账户</div><h1>你的健康，<br><em>值得被记录。</em></h1><p>建立账户，开始整理每一份健康信息。</p><div class="auth-decoration">✳</div></div><div class="panel auth-panel"><div class="eyebrow">CREATE ACCOUNT</div><h2>创建账户</h2><p class="muted">用户名 4–16 位；密码至少 6 位，包含字母和数字。</p>{% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}<form method="post" class="form-stack"><label>用户名<input name="username" value="{{ username }}" required autocomplete="username"></label><label>密码<input type="password" name="password" required autocomplete="new-password"></label><label>手机号 <small>选填</small><input name="phone" inputmode="tel"></label><label>邮箱 <small>选填</small><input name="email" type="email"></label><button class="button full">注册 <span>↗</span></button></form><p class="auth-tip">已有账户？ <a href="{{ url_for('login') }}">返回登录 →</a></p></div></section>
{% endblock %}
