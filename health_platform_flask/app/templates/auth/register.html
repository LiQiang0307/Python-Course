{% extends 'base.html' %}

{% block title %}注册{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>创建账号</h1>
    <p class="sub">注册一个账号，开始您的健康管理之旅</p>
    <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" class="form-control"
                   placeholder="4-16位，字母/数字/中文" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" class="form-control"
                   placeholder="至少6位，须包含数字和字母" required>
        </div>
        <div class="form-group">
            <label for="phone">手机号 <span class="hint">（可选）</span></label>
            <input type="tel" id="phone" name="phone" class="form-control" placeholder="11位手机号">
        </div>
        <div class="form-group">
            <label for="email">邮箱 <span class="hint">（可选）</span></label>
            <input type="email" id="email" name="email" class="form-control" placeholder="example@mail.com">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-block">注 册</button>
        </div>
    </form>
    <p class="auth-switch">已有账号？<a href="{{ url_for('auth.login') }}">去登录</a></p>
</div>
{% endblock %}
