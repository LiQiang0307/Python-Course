{% extends 'base.html' %}

{% block title %}添加健康记录{% endblock %}

{% block content %}
<div class="card" style="max-width:760px; margin:0 auto;">
    <div class="card-title">添加健康记录</div>
    <form method="POST" action="{{ url_for('main.add_record') }}">
        <div class="form-grid">
            <div class="form-group">
                <label for="record_type">记录类型</label>
                <select id="record_type" name="record_type" class="form-control">
                    <option value="体检">体检记录</option>
                    <option value="用药">用药记录</option>
                    <option value="其他">其他记录</option>
                </select>
            </div>
            <div class="form-group">
                <label for="record_date">记录日期</label>
                <input type="date" id="record_date" name="record_date" class="form-control">
            </div>

            <!-- 体检字段 -->
            <div class="form-group" data-record-type="体检">
                <label for="height">身高（cm）</label>
                <input type="number" step="0.1" id="height" name="height" class="form-control" placeholder="如 170">
            </div>
            <div class="form-group" data-record-type="体检">
                <label for="weight">体重（kg）</label>
                <input type="number" step="0.1" id="weight" name="weight" class="form-control" placeholder="如 65">
            </div>
            <div class="form-group" data-record-type="体检">
                <label for="blood_pressure">血压（mmHg）</label>
                <input type="text" id="blood_pressure" name="blood_pressure" class="form-control" placeholder="如 120/80">
            </div>
            <div class="form-group" data-record-type="体检">
                <label for="blood_sugar">空腹血糖（mmol/L）</label>
                <input type="number" step="0.1" id="blood_sugar" name="blood_sugar" class="form-control" placeholder="如 5.6">
            </div>
            <div class="form-group" data-record-type="体检">
                <label for="heart_rate">静息心率（次/分）</label>
                <input type="number" id="heart_rate" name="heart_rate" class="form-control" placeholder="如 72">
            </div>

            <!-- 用药字段 -->
            <div class="form-group" data-record-type="用药">
                <label for="medicine_name">药品名称</label>
                <input type="text" id="medicine_name" name="medicine_name" class="form-control" placeholder="如 阿莫西林">
            </div>
            <div class="form-group" data-record-type="用药">
                <label for="dosage">剂量</label>
                <input type="text" id="dosage" name="dosage" class="form-control" placeholder="如 500mg">
            </div>
            <div class="form-group" data-record-type="用药">
                <label for="frequency">频次</label>
                <input type="text" id="frequency" name="frequency" class="form-control" placeholder="如 每日3次">
            </div>
            <div class="form-group" data-record-type="用药">
                <label for="duration_days">用药天数</label>
                <input type="number" id="duration_days" name="duration_days" class="form-control" placeholder="如 7">
            </div>

            <!-- 其他字段 -->
            <div class="form-group" data-record-type="其他">
                <label for="value">数值/内容</label>
                <input type="text" id="value" name="value" class="form-control" placeholder="记录内容">
            </div>
            <div class="form-group" data-record-type="其他">
                <label for="unit">单位（可选）</label>
                <input type="text" id="unit" name="unit" class="form-control" placeholder="如 次、小时">
            </div>

            <div class="form-group full">
                <label for="notes">备注（可选）</label>
                <textarea id="notes" name="notes" class="form-control" rows="3" placeholder="补充说明…"></textarea>
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">保存记录</button>
            <a href="{{ url_for('main.records') }}" class="btn btn-ghost">取消</a>
        </div>
    </form>
</div>
{% endblock %}
