{% extends 'base.html' %}

{% block title %}健康评测{% endblock %}

{% block content %}
<div class="card" style="max-width:760px; margin:0 auto;">
    <div class="card-title">健康评测</div>
    <p style="color:var(--text-muted); margin-bottom:20px;">
        填写您最近一次体检的指标，系统将自动计算 BMI 并对血压、血糖、心率进行分级评测，
        给出健康建议。至少填写一项指标。
    </p>
    <form method="POST" action="{{ url_for('main.assessment') }}">
        <div class="form-grid">
            <div class="form-group">
                <label for="height">身高（cm）</label>
                <input type="number" step="0.1" id="height" name="height" class="form-control" placeholder="如 170">
            </div>
            <div class="form-group">
                <label for="weight">体重（kg）</label>
                <input type="number" step="0.1" id="weight" name="weight" class="form-control" placeholder="如 65">
            </div>
            <div class="form-group">
                <label for="blood_pressure">血压（收缩压/舒张压）</label>
                <input type="text" id="blood_pressure" name="blood_pressure" class="form-control" placeholder="如 120/80">
                <span class="hint">格式：120/80</span>
            </div>
            <div class="form-group">
                <label for="blood_sugar">空腹血糖（mmol/L）</label>
                <input type="number" step="0.1" id="blood_sugar" name="blood_sugar" class="form-control" placeholder="如 5.6">
            </div>
            <div class="form-group">
                <label for="heart_rate">静息心率（次/分）</label>
                <input type="number" id="heart_rate" name="heart_rate" class="form-control" placeholder="如 72">
            </div>
            {% if session.get('user_id') %}
            <div class="form-group" style="justify-content:flex-end;">
                <label class="checkbox-group">
                    <input type="checkbox" name="save_record">
                    同时保存为体检记录
                </label>
            </div>
            {% endif %}
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">开始评测</button>
            <a href="{{ url_for('main.index') }}" class="btn btn-ghost">返回首页</a>
        </div>
    </form>
</div>
{% endblock %}
